name: Android Testing Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    environment: Release

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Extract Assets
        run: |
          mkdir -p app/src/main/assets/
          unzip assets/kanji.zip -d app/src/main/assets
          unzip assets/databases.zip -d app/src/main/assets

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Decode Keystore
        run: echo "${{ secrets.SIGNING_KEY }}" | base64 -d > release.jks

      - name: Build and Sign All Variants
        env:
          KEYSTORE_FILE: ${{ github.workspace }}/release.jks
          KEY_ALIAS: ${{ secrets.ALIAS }}
          KEYSTORE_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew assembleFullRelease assembleFossRelease
          
          # Move and rename for easier identification
          mv app/build/outputs/apk/full/release/app-full-release.apk kantan-full.apk
          mv app/build/outputs/apk/foss/release/app-foss-release.apk kantan-foss.apk
          
          # Verification logs
          echo "Full APK SHA-256: $(sha256sum kantan-full.apk | awk '{ print $1 }')"
          echo "Foss APK SHA-256: $(sha256sum kantan-foss.apk | awk '{ print $1 }')"

      - name: Upload Full APK
        uses: actions/upload-artifact@v4
        with:
          name: kantan-full-latest
          path: kantan-full.apk
          retention-days: 3

      - name: Upload FOSS APK
        uses: actions/upload-artifact@v7
        with:
          name: kantan-foss-latest
          path: kantan-foss.apk
          retention-days: 3

      - name: Cleanup
        if: always()
        run: rm -f release.jks