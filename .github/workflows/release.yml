name: Android Release
on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag name (e.g: 1.0.0)'
        required: true
        type: string
      release_name:
        description: 'Release name (e.g: Release 1.0.0)'
        required: true
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    environment: Release
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Extract Assets
        run: |
          mkdir -p app/src/main/assets/
          unzip assets/kanji.zip -d app/src/main/assets
          unzip assets/databases.zip -d app/src/main/assets

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Decode Keystore
        run: echo "${{ secrets.SIGNING_KEY }}" | base64 -d > release.jks

      - name: Build and Sign All Variants
        id: generate_hash
        env:
          KEYSTORE_FILE: ${{ github.workspace }}/release.jks
          KEY_ALIAS: ${{ secrets.ALIAS }}
          KEYSTORE_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew assembleFullRelease assembleFossRelease
          
          # Define names with tags
          FULL_NAME="kantan-full-${{ github.event.inputs.tag_name }}.apk"
          FOSS_NAME="kantan-foss-${{ github.event.inputs.tag_name }}.apk"

          # Move and rename
          mv app/build/outputs/apk/full/release/app-full-release.apk "$FULL_NAME"
          mv app/build/outputs/apk/foss/release/app-foss-release.apk "$FOSS_NAME"

          # Generate and set hashes for the release body
          FULL_SHA=$(sha256sum "$FULL_NAME" | awk '{print $1}')
          FOSS_SHA=$(sha256sum "$FOSS_NAME" | awk '{print $1}')
          
          echo "full_sha=$FULL_SHA" >> $GITHUB_OUTPUT
          echo "foss_sha=$FOSS_SHA" >> $GITHUB_OUTPUT

      - name: Create Draft Release with APKs
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event.inputs.tag_name }}
          name: ${{ github.event.inputs.release_name }}
          draft: true
          files: |
            kantan-full-${{ github.event.inputs.tag_name }}.apk
            kantan-foss-${{ github.event.inputs.tag_name }}.apk
          body: |
            <!-- Write changelog here -->

            ---
            ### Security Verification
            **APK (Full) SHA-256 Hash:** `${{ steps.generate_hash.outputs.full_sha }}`
            **APK (Foss) SHA-256 Hash:** `${{ steps.generate_hash.outputs.foss_sha }}`
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Cleanup
        if: always()
        run: rm -f release.jks